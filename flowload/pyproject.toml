[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowload"
version = "0.1.0"
description = "Automação de entrada de dados (estilo DataLoad) com uma linguagem simples em português"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
xlsx = ["openpyxl>=3.1"]

[project.scripts]
flowload = "flowload.cli:main"

[tool.setuptools]
packages = ["flowload"]
